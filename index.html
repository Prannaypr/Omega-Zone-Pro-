<script>
        function rateCardApp() {
            return {
                showSplash: false,
                scrolledDown: false,
                lastScroll: 0,
                handleBack() {
                    if (this.selectedModel) {
                        this.selectedModel = null;
                        this.selectedGroupForModal = null;
                        return true;
                    }
                    if (this.showProductModal) {
                        this.showProductModal = false;
                        return true;
                    }
                    if (this.showCompareModal) {
                        this.showCompareModal = false;
                        return true;
                    }
                    if (this.showPartnerModal) {
                        this.showPartnerModal = false;
                        return true;
                    }
                    return false;
                },
                init() {
                    window.app = this; // Expose to global scope for Java to call
                    // Load state from localStorage
                    const savedState = localStorage.getItem('omegaZoneState');
                    if (savedState) {
                        const parsed = JSON.parse(savedState);
                        this.darkMode = parsed.darkMode || false;
                        this.vshieldPro = parsed.vshieldPro || false;
                        this.currentTab = 'Product'; // Product-only version
                        this.searchHistory = parsed.searchHistory || [];
                        this.compareList = parsed.compareList || [];
                        this.showCompareModal = false;
                        this.selectedProductModel = parsed.selectedProductModel || 'Y05';
                        this.productSearchQuery = parsed.productSearchQuery || '';
                        this.productSeriesFilter = parsed.productSeriesFilter || 'All';
                        this.productRamFilter = parsed.productRamFilter || 'All';
                        this.productRomFilter = parsed.productRomFilter || 'All';
                        this.productSortBy = parsed.productSortBy || 'default';
                        this.searchQuery = parsed.searchQuery || '';
                        this.selectedSeries = parsed.selectedSeries || 'All';
                        this.selectedRam = parsed.selectedRam || 'All';
                        this.selectedRom = parsed.selectedRom || 'All';
                        this.sortBy = parsed.sortBy || 'default';
                    }

                    // Watch for searchQuery changes to update history
                    this.$watch('searchQuery', (value) => {
                        this.saveState();
                        if (value && value.length > 2) {

                    // Watch product filters to save state
                    this.$watch('productSearchQuery', () => this.saveState());
                    this.$watch('productSeriesFilter', () => this.saveState());
                    this.$watch('productRamFilter', () => this.saveState());

                toggleCompare(model) {

                setProductModel(modelName) {
                    if (this.catalog[modelName]) {
                        this.selectedProductModel = modelName;
                        this.showProductModal = true;
                        this.discoverProductColors(modelName);

                imageFolder: 'IMAGE',
                imageExtension: '.' + 'png',
                productColorCandidates: [
                    'Black', 'Blue', 'Gold', 'Green', 'Grey', 'Gray', 'Orange',
                    'Pink', 'Purple', 'Red', 'Silver', 'White', 'Yellow', 'Titanium'
                ],
                productImageCache: {},

                slugifyProductPart(value) {
                    return String(value || '')
                        .toLowerCase()
                        .replace(/\+/g, ' plus ')
                        .replace(/[^a-z0-9]+/g, '_')
                        .replace(/^_+|_+$/g, '');
                },

                // Build the exact image filename used in the IMAGE folder.
                // Example:
                // Y11 5G + Sunrise Gold -> IMAGE/y11_sunrise_gold.png
                // Y11 5G + Midnight Blue -> IMAGE/y11_midnight_blue.png
                productImageBaseName(modelName) {
                    return String(modelName || '')
                        .toLowerCase()
                        .replace(/^vivo\s+/, '')
                        .replace(/\s*5g\s*$/i, '')
                        .replace(/\s+/g, '_')
                        .replace(/[^a-z0-9_]+/g, '_')
                        .replace(/^_+|_+$/g, '');
                },

                productColorFileName(modelName, colorName) {
                    const model = this.productImageBaseName(modelName);
                    const color = this.slugifyProductPart(colorName || 'default');
                    return this.imageFolder + '/' + model + '_' + color + this.imageExtension;
                },

                productImageCandidatesFor(modelName, colorName = 'Default') {
                    const model = this.productImageBaseName(modelName);
                    const color = this.slugifyProductPart(colorName);
                    const ext = this.imageExtension;
                    const base = this.imageFolder + '/';

                    if (color === 'default') {
                        return [
                            base + model + ext,
                            base + model + '_default' + ext
                        ];
                    }

                    // Exact color filename is ALWAYS first.
                    return [
                        this.productColorFileName(modelName, colorName),
                        base + model + '_' + color + ext,
                        base + model + '-' + color + ext
                    ];
                },

                getProductImage(modelName, colorName) {
                    const model = this.catalog[modelName];
                    if (!model) return '';

                    const colors = model.colors || [];
                    const color = colorName || colors[0] || 'Default';

                    // If the user selected a color, immediately show its exact
                    // IMAGE/<model>_<color>.png file.
                    if (colorName) {
                        const exact = this.productColorFileName(modelName, colorName);
                        if (!this.productImageCache[modelName]) {
                            this.productImageCache[modelName] = {};
                        }
                        this.productImageCache[modelName][color] = exact;
                        return exact;
                    }

                    const cached = this.productImageCache?.[modelName]?.[color];
                    if (cached) return cached;

                    const candidates = this.getCardImageCandidates(modelName);
                    return candidates[0] || '';
                },

                getCardImageCandidates(modelName) {
                    const allColors = ['Default', ...this.productColorCandidates];
                    return [...new Set(allColors.flatMap(color =>
                        this.productImageCandidatesFor(modelName, color)
                    ))];
                },

                async imageExists(url) {
                    return new Promise(resolve => {
                        const probe = new Image();
                        probe.onload = () => resolve(true);
                        probe.onerror = () => resolve(false);
                        probe.src = url;
                    });
                },

                async discoverProductColors(modelName) {
                    if (!this.catalog[modelName]) return;
                    if (!this.productImageCache[modelName]) this.productImageCache[modelName] = {};

                    const found = [];
                    for (const color of this.productColorCandidates) {
                        const candidates = this.productImageCandidatesFor(modelName, color);
                        for (const url of candidates) {
                            if (await this.imageExists(url)) {
                                this.productImageCache[modelName][color] = url;
                                found.push(color);
                                break;
                            }
                        }
                    }

                    if (!found.length) {
                        for (const url of this.productImageCandidatesFor(modelName, 'Default')) {
                            if (await this.imageExists(url)) {
                                this.productImageCache[modelName].Default = url;
                                found.push('Default');
                                break;
                            }
                        }
                    }

                    if (found.length) {
                        this.catalog[modelName].colors = found;
                        if (!found.includes(this.selectedColor)) this.selectedColor = found[0];
                    }
                },

                cycleProductImage(event, modelName, colorName) {
                    const img = event.target;
                    const attempted = Number(img.dataset.imageAttempt || 0);
                    const candidates = colorName
                        ? this.productImageCandidatesFor(modelName, colorName)
                        : this.getCardImageCandidates(modelName);

                    if (attempted + 1 < candidates.length) {
                        img.dataset.imageAttempt = String(attempted + 1);
                        img.src = candidates[attempted + 1];
                    } else {
                        // Keep the image box visible instead of leaving a broken
                        // blank area. The exact filename is shown in the console
                        // to make missing Android asset names easy to diagnose.
                        img.dataset.imageAttempt = '0';
                        console.warn('Omega Zone image not found:', candidates[0]);
                    }
                },

                        const matchesSearch = name.toLowerCase().includes(this.productSearchQuery.toLowerCase());
                        const matchesSeries = this.productSeriesFilter === 'All' || model.series === this.productSeriesFilter;

                        // Check performance and design strings for RAM/ROM
                        const perfString = (model.performance || []).join(' ') + ' ' + (model.design || []).join(' ');
                        const ramRegex = new RegExp('\\b' + this.productRamFilter + '\\b', 'i');
                        const romRegex = new RegExp('\\b' + this.productRomFilter + '\\b', 'i');

                        const matchesRam = this.productRamFilter === 'All' || ramRegex.test(perfString);
                        const matchesRom = this.productRomFilter === 'All' || romRegex.test(perfString);

                        return matchesSearch && matchesSeries && matchesRam && matchesRom;
                    });

                    if (this.productSortBy === 'name') {
                        list.sort();
                    } else if (this.productSortBy === 'price-low') {
                        list.sort((a, b) => {
                            let pA = parseInt(this.catalog[a].price.replace(/,/g, '')) || 0;

                get availableSchemes() {
                    const partnerMap = {
                        'Bajaj Finance': 'bajajSchemes',
                        'IDFC First Bank': 'idfcSchemes',
                        'TVS Credit': 'tvsSchemes',
                        'Home Credit': 'homeCreditSchemes',
                        'DMI Finance': 'dmiSchemes',
                        'HDB Financial Services': 'hdbSchemes',
                        'ICICI Bank': 'iciciSchemes',
                        'Poonawalla': 'poonawallaSchemes',
                        'Chola': 'cholaSchemes'
                    };

                    const prop = partnerMap[this.calcPartner];
                    if (prop && this.selectedModel && this.selectedModel[prop] && this.selectedModel[prop].length > 0) {
                        return this.selectedModel[prop].map(sch => {
                            let parts = sch.split('|');
                            let t = parts[0];
                            let adv = parts[1] || '0';
                            let label = `${t} Months / ${adv} Advance EMIs (${sch})`;
                            return { val: sch, label: label };
                        });
                    } else {
                        // Standard schemes for other partners or if no specific schemes found
                        return [
                            { val: '3|0', label: '3 Months / 0 Advance (3/0 NCE)' },
                            { val: '6|0', label: '6 Months / 0 Advance (6/0 NCE)' },
                            { val: '8|0', label: '8 Months / 0 Advance (8/0 NCE)' },
                            { val: '8|2', label: '8 Months / 2 Advance EMIs (8/2 Scheme)' },
                            { val: '10|0', label: '10 Months / 0 Advance (10/0 NCE)' },
                            { val: '12|0', label: '12 Months / 0 Advance (12/0 NCE)' },
                            { val: '12|4', label: '12 Months / 4 Advance EMIs (12/4 Scheme)' },
                            { val: '18|0', label: '18 Months / 0 Advance (18/0 LCE)' },
                            { val: '24|0', label: '24 Months / 0 Advance (24/0 LCE)' }
                        ];
                    }
                },

                get calcTenure() {
                    if (!this.calcScheme) return 12;
                    let parts = this.calcScheme.split(/[\/|]/);
                    return parseInt(parts[0]) || 12;
                },
                get calcAdvanceEmis() {
                    if (!this.calcScheme) return 0;
                    let parts = this.calcScheme.split(/[\/|]/);
                    return parseInt(parts[1]) || 0;
                },
                get monthlyEmi() {
                    if (!this.selectedModel) return 0;
                    return Math.round(this.selectedModel.mop / this.calcTenure);
                },
                get advanceDownPayment() {
                    return this.calcAdvanceEmis * this.monthlyEmi;
                },
                get netLoanAmount() {
                    if (!this.selectedModel) return 0;
                    return Math.max(0, this.selectedModel.mop - this.advanceDownPayment);
                },

                get groupedModels() {
                    let map = {};
                    this.models.forEach(m => {
                        // Strict filter using Word Boundaries to avoid "6GB" matching "16GB"
                        const ramRegex = new RegExp('\\b' + this.selectedRam + '\\b', 'i');
                        const romRegex = new RegExp('\\b' + this.selectedRom + '\\b', 'i');

                        let matchesRam = this.selectedRam === 'All' || ramRegex.test(m.specs || '');
                        let matchesRom = this.selectedRom === 'All' || romRegex.test(m.specs || '');

                        if (matchesRam && matchesRom) {
                            if (!map[m.name]) {
                                map[m.name] = {
                                    name: m.name,
                                    series: m.series,
                                    variants: []
                                };
                            }
                            map[m.name].variants.push(m);
                        }
                    });

                    let groups = Object.values(map);

                    let filtered = groups.filter(g => {
                        let matchesSeries = this.selectedSeries === 'All' || g.series === this.selectedSeries;
                        let matchesSearch = this.searchQuery === '' || 
                            (g.name && g.name.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                            (g.series && g.series.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                            g.variants.some(v =>
                                (v.specs && v.specs.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                                (v.banksEmi && v.banksEmi.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                                (v.banksFullswipe && v.banksFullswipe.toLowerCase().includes(this.searchQuery.toLowerCase()))
                            );

                        return matchesSeries && matchesSearch;
                    });

                    if (this.sortBy === 'price-low') {
                        filtered.sort((a, b) => {
                            let minA = Math.min(...a.variants.map(v => v.mop));
                            let minB = Math.min(...b.variants.map(v => v.mop));
                            return minA - minB;
                        });
                    } else if (this.sortBy === 'price-high') {
                        filtered.sort((a, b) => {
                            let maxA = Math.max(...a.variants.map(v => v.mop));
                            let maxB = Math.max(...b.variants.map(v => v.mop));
                            return maxB - maxA;
                        });
                    } else if (this.sortBy === 'name') {
                        filtered.sort((a, b) => a.name.localeCompare(b.name));
                    }
                    return filtered;
                },

                getSelectedVariant(group) {
                    let idx = this.variantSelections[group.name] || 0;
                    return group.variants[idx] || group.variants[0];
                },

                getVariantIndex(groupName) {
                    return this.variantSelections[groupName] || 0;
                },

                setVariant(groupName, idx) {
                    this.variantSelections[groupName] = idx;
                },

                changeModalVariant(idx) {
                    if (this.selectedGroupForModal && this.selectedGroupForModal.variants[idx]) {
                        this.selectedModel = this.selectedGroupForModal.variants[idx];
                        this.onPartnerChange();
                    }
                },

                onPartnerChange() {
                    if (this.calcPartner === 'Bajaj Finance' && this.selectedModel && this.selectedModel.bajajSchemes && this.selectedModel.bajajSchemes.length > 0) {
                        this.calcScheme = this.selectedModel.bajajSchemes[0];
                    } else if (this.calcPartner === 'IDFC First Bank' && this.selectedModel && this.selectedModel.idfcSchemes && this.selectedModel.idfcSchemes.length > 0) {
                        this.calcScheme = this.selectedModel.idfcSchemes[0];
                    } else if (this.calcPartner === 'TVS Credit' && this.selectedModel && this.selectedModel.tvsSchemes && this.selectedModel.tvsSchemes.length > 0) {
                        this.calcScheme = this.selectedModel.tvsSchemes[0];
                    } else if (this.calcPartner === 'Home Credit' && this.selectedModel && this.selectedModel.homeCreditSchemes && this.selectedModel.homeCreditSchemes.length > 0) {
                        this.calcScheme = this.selectedModel.homeCreditSchemes[0];
                    } else {
                        this.calcScheme = '12|0';
                    }
                },

                resetFilters() {
                    this.searchQuery = '';
                    this.selectedSeries = 'All';
                    this.selectedRam = 'All';
                    this.selectedRom = 'All';
                    this.sortBy = 'default';
                    this.variantSelections = {};
                },

                openModal(group) {
                    let variant = this.getSelectedVariant(group);
                    this.selectedModel = variant;
                    this.selectedGroupForModal = group;
                    this.calcPartner = 'Bajaj Finance';
                    this.onPartnerChange();
                    this.activeTab = 'paper-finance';
                },

                getPartnerPf(partner) {
                    const pfMap = {
                        'Bajaj Finance': 599,
                        'IDFC First Bank': 499,
                        'DMI Finance': 699,
                        'HDB Financial Services': 599,
                        'TVS Credit': 499,
                        'Chola': 799,
                        'Poonawalla': 699
                    };
                    return pfMap[partner] || 599;
                },

                getCdpPf(mop) {
                    if (!mop) return 0;
                    if (mop <= 20000) return 699;
                    if (mop <= 50000) return 1499;
                    if (mop <= 70000) return 1999;
                    if (mop <= 100000) return 3999;
                    if (mop <= 120000) return 5999;
                    return 10999;
                }
            }
        }
